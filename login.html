<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - Black Beauty</title>

    <!-- home.css gives us the same header as the home page -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header>
    <!-- LOGO -->
    <a href="index.html">
        <img class="logo" src="IMAGES/327176067_856763338905141_3168379092967939775_n-removebg-preview.png" alt="Black Beauty logo">
    </a>

    <nav>
        <a href="home.html">Home</a>
        <a href="products.html">Shampoo &amp; Conditioners</a>
        <a href="features.html">Features</a>
        <a href="about.html">About</a>
        <a href="contacts.html">Contacts</a>
    </nav>

    <a href="login.html" class="account">
        <i class="bi bi-person-circle"></i>
    </a>
</header>

<section class="login">
    <div class="login-box">
        <h2>Log In</h2>

        <form action="admin.html">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            
            
            <button type="submit">Log In</button>
            
        </form>

        <p class="small-text"><a href="#">Forgot your password?</a></p>
        <p class="small-text">New here? <a href="#" class="create">Create an account</a></p>
    </div>
</section>

</body>
</html>
